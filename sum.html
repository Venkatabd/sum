<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="sum.css">
</head>
<body>
    
    

     <section class="fish-store">
  <div class="store-header">
    <h2> Available Fishes</h2>
    <select class="dropdown">
      <option selected>Guppy</option>
      <option>Molly</option>
      <option>Blue Cobra</option>
    </select>
  </div>
    


    <div class="card">
      <a href="#img1"><img src="./guppies.jpg" alt="Guppies"></a>
      <div class="info">
        <h4>Guppies</h4>
        <span class="rating">⭐⭐⭐⭐4.8</span>
        <p class="price">₹150 / Pair</p>
        <button>Add to Cart</button>
      </div>
    </div>


    <div class="card">
      <a href="#img2"><img src="./molly.jpg" alt="Molly"></a>
      <div class="info">
        <h4>Orange Molly</h4>
        <span class="rating">⭐⭐⭐⭐4.7</span>
        <p class="price">₹100 / Pair</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </div>

</section>

</body>
</html>
